[singbox]
config_path = "/etc/sing-box/config.json"
binary_path = "/etc/sing-box/bin/sing-box"
grpc_addr   = "127.0.0.1:18080"

[db]
path = "/etc/sing-box/manager/manager.db"

[stats]
sync_interval_secs   = 30
# 告警首档百分比；另外两档固定 90 / 100，与 Telegram 的三档开关一一对应
quota_alert_percent  = 80

[kernel]
# 从此仓库拉取带 with_v2ray_api 的自编译 sing-box（tag 形如 singbox-v1.10.x）
update_repo = "why1f/singbox-manager"

[subscription]
enabled     = true
listen      = "127.0.0.1:18081"
# 对外 URL 基础，用于拼订阅链接和 nginx server_name
# 设置后 TUI nginx 页 [g] 可以生成反代配置
public_base = ""                                    # 例: "https://sub.example.com"
# 是否让订阅里节点导出的 server 跟随 public_base 主机；默认 false，直接导出公网 IP
use_public_base_as_server = false
nginx_conf  = "/etc/nginx/conf.d/sb-manager.conf"

[telegram]
enabled = false
bot_token = ""
# 支持 ±HH:MM 偏移和无夏令时的 IANA 名（Asia/Shanghai、Asia/Tokyo 等）。
# 有夏令时的时区（Europe/London、America/* …）会被拒绝并回落 +08:00，请直接填偏移量。
timezone = "Asia/Shanghai"
# 管理员 chat_id，找 @userinfobot 获取；留空则没有管理员面板
admin_chat_ids = []
poll_interval_secs = 2
request_timeout_secs = 10
default_notify_quota_80 = true
default_notify_quota_90 = true
default_notify_quota_100 = true
default_schedule_enabled = true
default_schedule_times = ["09:00", "21:30"]
admin_notify_quota = true
admin_schedule_enabled = true
admin_schedule_times = ["09:00", "21:30"]
